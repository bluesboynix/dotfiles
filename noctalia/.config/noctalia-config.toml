[bar.default]
background_opacity = 0.64999998547136784
center = [ "active_window" ]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "clock",
    "control-center",
    "session"
]
margin_edge = 5
padding = 16
position = "bottom"
thickness = 35

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
time_format = "{:%I:%M}"

[theme]
builtin = "Nord"
mode = "dark"
source = "builtin"

    [theme.templates]
    builtin_ids = [
        "alacritty",
        "btop",
        "cava",
        "emacs",
        "foot",
        "gtk3",
        "gtk4",
        "ghostty",
        "helix",
        "kcolorscheme",
        "kitty",
        "niri",
        "qt",
        "wezterm"
    ]
    community_ids = [ "strata" ]

[wallpaper.default]
path = "/home/bluesboy/Pictures/Wallpapers/nord/kittyboard.png"

[wallpaper.last]
path = "/home/bluesboy/Pictures/Wallpapers/nord/kittyboard.png"

[wallpaper.monitors.HDMI-A-1]
path = "/home/bluesboy/Pictures/Wallpapers/nord/kittyboard.png"

[widget.clock]
format = "{:%I:%M %P}"

[widget.media]
hide_when_no_media = true
