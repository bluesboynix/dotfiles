# =========================
# General
# =========================

# Start paused: no
pause=no

# Remember playback position
save-position-on-quit=yes

# Keep window open after playback
keep-open=yes

# Show playback controls
osc=yes

# Nice window title
title=${media-title}

# =========================
# Video
# =========================

# GPU video output
vo=gpu-next

# Hardware decoding
hwdec=auto-safe

# Video quality
profile=gpu-hq

# Scaling
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell

# Debanding
deband=yes

# Smooth interpolation
interpolation=yes
tscale=oversample

# =========================
# Color / HDR
# =========================

# Better color quality
video-sync=display-resample

# =========================
# Audio
# =========================

# Audio quality
audio-channels=auto

# Normal volume
volume=100

# Allow volume above 100%
volume-max=200

# =========================
# Subtitles
# =========================

sub-auto=fuzzy

# Font
sub-font="FiraCode Nerd Font"

# Subtitle size
sub-font-size=40

# Subtitle position
sub-pos=90

# Subtitle outline
sub-border-size=2

# =========================
# Screenshots
# =========================

screenshot-format=png
screenshot-directory=~/Pictures/Screenshots

# =========================
# OSD
# =========================

osd-level=1
osd-bar=yes
osd-duration=1000

# =========================
# Cache / Network
# =========================

cache=yes
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB